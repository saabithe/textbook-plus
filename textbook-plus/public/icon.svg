<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#18181B"/>
  
  <!-- Book -->
  <g transform="translate(88, 90)">
    <!-- Book cover -->
    <rect x="60" y="20" width="220" height="290" rx="14" fill="#3B82F6"/>
    <!-- Book pages -->
    <rect x="72" y="32" width="196" height="266" rx="8" fill="#FFFFFF"/>
    <!-- Book spine shadow -->
    <rect x="72" y="32" width="20" height="266" rx="8" fill="#E4E4E7"/>
    <!-- Page lines -->
    <rect x="108" y="80" width="130" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="100" width="150" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="120" width="110" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="150" width="140" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="170" width="120" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="190" width="100" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="220" width="130" height="6" rx="3" fill="#D4D4D8"/>
    <rect x="108" y="240" width="90" height="6" rx="3" fill="#D4D4D8"/>
  </g>
  
  <!-- ++ badge -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="120" height="80" rx="16" fill="#3B82F6"/>
    <text x="60" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle">++</text>
  </g>
</svg>
