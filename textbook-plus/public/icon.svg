<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Bottom book -->
  <g transform="translate(90, 260)">
    <rect x="0" y="0" width="320" height="50" rx="4" fill="#18181B"/>
    <rect x="8" y="6" width="304" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="0" y="0" width="320" height="50" rx="4" stroke="#18181B" stroke-width="6"/>
  </g>
  <!-- Middle book -->
  <g transform="translate(95, 200)">
    <rect x="0" y="0" width="310" height="50" rx="4" fill="#18181B"/>
    <rect x="8" y="6" width="294" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="0" y="0" width="310" height="50" rx="4" stroke="#18181B" stroke-width="6"/>
  </g>
  <!-- Top book -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="300" height="50" rx="4" fill="#18181B"/>
    <rect x="8" y="6" width="284" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="0" y="0" width="300" height="50" rx="4" stroke="#18181B" stroke-width="6"/>
  </g>
  <!-- ++ badge top right -->
  <text x="420" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="80" font-weight="800" fill="#18181B" text-anchor="middle">++</text>
